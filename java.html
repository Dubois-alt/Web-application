<script>
    let x = 5;
    let y = 10;

    let age = 30;
    document.write("<br>My name is: " + fullName + "<br>and I am " + age + " years old.");

    document.write("<br>My score is: " + score);

    document.write("<br>My favorite fruits are: " + fruits);
    fruits.join(", ");

    //conditions
    let food = prompt("Enter a food name:");

        document.write("<br>" + food + " is not in the list of fruits.");
